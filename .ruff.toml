# Mirrors the Home Assistant core conventions closely enough to keep this
# custom integration lint-clean against upstream style.
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "PIE", "C4", "D"]
ignore = [
  "D203",  # conflicts with D211
  "D213",  # conflicts with D212
]

[lint.per-file-ignores]
"custom_components/haier_ac_bridge/const.py" = ["D"]

[lint.isort]
known-first-party = ["homeassistant"]
force-sort-within-sections = true
